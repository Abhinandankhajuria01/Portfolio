<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="ak_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a3a3a3" />
    </linearGradient>
    <linearGradient id="border_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Dark Background Card -->
  <rect width="512" height="512" rx="128" fill="#070707" />
  <rect x="12" y="12" width="488" height="488" rx="116" stroke="url(#border_grad)" stroke-width="8" fill="none" />
  
  <!-- Sleek AK Geometric Monogram -->
  <g filter="url(#glow)">
    <!-- Letter A -->
    <path d="M120 372 L200 140 L240 140 L320 372 L270 372 L255 320 L185 320 L170 372 Z M200 275 L240 275 L220 205 Z" fill="url(#ak_grad)" />
    <!-- Letter K -->
    <path d="M305 140 L350 140 L350 240 L415 140 L470 140 L395 250 L475 372 L420 372 L350 265 L350 372 L305 372 Z" fill="url(#ak_grad)" />
    <!-- Cyber Dot -->
    <circle cx="465" cy="155" r="14" fill="#ef4444" />
  </g>
</svg>